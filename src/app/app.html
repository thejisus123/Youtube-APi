<nav class="navbar bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand fw-bold">ScrompyTube</span>
  </div>
</nav>

<main class="container my-4">
  <div class="row justify-content-center mb-4">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="input-group">
        <input
          [(ngModel)]="textoBusqueda"
          type="text"
          class="form-control"
          placeholder="Buscar vídeos..."
          (keyup.enter)="buscar()"
        >

        <button
          type="button"
          class="btn btn-primary"
          (click)="buscar()"
        >
          Buscar
        </button>
      </div>
    </div>
  </div>

  <section class="row g-3">
    @for (video of resultados; track $index) {
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <img
            [src]="video.snippet.thumbnails.medium.url"
            class="card-img-top"
            [alt]="video.snippet.title"
          >

          <div class="card-body">
            <h5 class="card-title">
              {{ video.snippet.title }}
            </h5>

            <p class="card-text text-muted">
              {{ video.snippet.channelTitle }}
            </p>

            <button
              type="button"
              class="btn btn-primary"
              (click)="seleccionarVideo(video)"
            >
              Ver video
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center text-muted py-5 border rounded">
        Los resultados aparecerán aquí
      </div>
    }
  </section>

  @if (videoSeleccionado) {
    <div class="mt-4">
      <div class="card">
        <div class="card-body">
          <h4>{{ videoSeleccionado.snippet.title }}</h4>

          <div class="ratio ratio-16x9">
            <iframe
              [src]="videoUrl"
              title="Video de YouTube"
              allowfullscreen>
            </iframe>
          </div>

          <button
            type="button"
            class="btn btn-secondary mt-3"
            (click)="cerrarVideo()"
          >
            Cerrar video
          </button>
        </div>
      </div>
    </div>
  }
</main>
