name: Deploy a Firebase Hosting al hacer merge a main
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Crear environment.ts
        env:
          ENVIRONMENT_TS: ${{ secrets.ENVIRONMENT_TS }}
        run: |
          mkdir -p src/environments
          printf '%s\n' "$ENVIRONMENT_TS" > src/environments/environment.ts
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: app-toribio-kirk
